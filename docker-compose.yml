# Lancer : docker compose up -d --build   ->  http://localhost:8080
# Connexion : admin@psm.com / Admin@123
services:
  db:
    image: mysql:8.0
    container_name: psm-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: change-me
      MYSQL_DATABASE: psm_db
      TZ: UTC
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pchange-me --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: .
    container_name: psm-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: psm_db
      DB_USERNAME: root
      DB_PASSWORD: change-me
      # Secret JWT : valeur par defaut pour la demo (a changer en production)
      JWT_SECRET: ${JWT_SECRET:-h2g9TniN374bBZzzA/AucW11twGqFmvaAG0F/GExL2Uj12+nFP7Fr59VgHZWyCNK}
      ADMIN_EMAIL: admin@psm.com
      ADMIN_PASSWORD: Admin@123
      ADMIN_NOTIFY_EMAIL: admin@psm.com
      SEED_DEMO_DATA: "true"
      # --- Email (decommenter et remplir ; exemple Mailtrap) ---
      # MAIL_HOST: sandbox.smtp.mailtrap.io
      # MAIL_PORT: "2525"
      # MAIL_USERNAME: votre-identifiant
      # MAIL_PASSWORD: votre-mot-de-passe
      # MAIL_SMTP_AUTH: "true"
      # MAIL_STARTTLS: "true"
      # MAIL_FROM: no-reply@psm.com

volumes:
  dbdata:
